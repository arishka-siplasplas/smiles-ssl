[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smiles-ssl"
version = "0.1.0"
description = "Long SSL pretraining and anomaly classification experiments"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26", "scipy>=1.11", "scikit-learn>=1.4", "torch>=2.2",
  "torchvision>=0.17", "timm==1.0.22", "catboost>=1.2.7", "lightgbm==4.6.0", "pandas>=2.2", "Pillow>=10", "matplotlib>=3.8",
  "statsmodels>=0.14"
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
smiles-ssl = "smiles_ssl.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
